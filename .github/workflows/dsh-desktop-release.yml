name: DSH Windows Desktop Release

# Build the Windows desktop installer from the node closure. Master pushes and
# non-tag dispatches produce a SHA-keyed prerelease; desktop-v* tags produce a
# Latest release when the tag suffix equals the root package.json version.
on:
  push:
    branches: [master]
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dsh-desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build-and-release:
    name: Build and publish Windows desktop installer
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Enable Windows Developer Mode
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Resolve pnpm JavaScript entrypoint
        shell: pwsh
        run: |
          $entrypoint = pnpm exec node -p "process.env.npm_execpath"
          if ([string]::IsNullOrWhiteSpace($entrypoint) -or -not (Test-Path -LiteralPath $entrypoint -PathType Leaf)) {
            throw "Could not resolve pnpm's JavaScript entrypoint"
          }
          "npm_execpath=$entrypoint" >> $env:GITHUB_ENV

      - name: Deploy node closure
        shell: pwsh
        env:
          DSH_BUILD_CLIENT_PROFILE: official
        run: >-
          pnpm exec tsx scripts/build-exe-for-python-sdk.ts
          --targets=node24-win-x64 --skip-pkg

      - name: Build Windows installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --filter @deepseek-ai/dsh-desktop dist

      - name: Smoke staged runtime
        shell: pwsh
        run: pnpm exec tsx scripts/smoke-desktop-runtime.ts

      - name: Create checksums
        shell: pwsh
        run: |
          $assets = @(
            'dist-desktop/DeepSeek-Harness-Setup-*-x64.exe'
          )
          $resolved = Get-ChildItem -Path $assets -File
          if ($resolved.Count -ne 1) {
            throw "Expected one release asset, found $($resolved.Count)"
          }
          foreach ($asset in $resolved) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Build asset is missing: $asset"
            }
          }
          Get-FileHash -Algorithm SHA256 $resolved |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path.Substring((Resolve-Path '.').Path.Length + 1).Replace('\', '/'))" } |
            Set-Content dist-desktop/SHA256SUMS

      - name: Resolve release identity
        id: release
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $shortSha = $env:GITHUB_SHA.Substring(0, 12)
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            $prefix = 'desktop-v'
            if (-not $tag.StartsWith($prefix)) {
              throw "Unexpected desktop release tag: $tag"
            }
            $suffix = $tag.Substring($prefix.Length)
            if ($suffix -ne $version) {
              throw "Tag $tag suffix '$suffix' does not equal package.json version '$version'"
            }
            "tag=$tag" >> $env:GITHUB_OUTPUT
            "prerelease=false" >> $env:GITHUB_OUTPUT
            "title=DSH Windows desktop $version" >> $env:GITHUB_OUTPUT
          } else {
            "tag=dsh-desktop-$shortSha" >> $env:GITHUB_OUTPUT
            "prerelease=true" >> $env:GITHUB_OUTPUT
            "title=DSH Windows desktop $version ($shortSha)" >> $env:GITHUB_OUTPUT
          }

      - name: Create or update GitHub Latest release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG `
              --target $env:GITHUB_SHA `
              --title $env:RELEASE_TITLE `
              --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Could not create release $env:RELEASE_TAG" }
          }

      - name: Create or update GitHub prerelease
        if: github.ref_type != 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG `
              --target $env:GITHUB_SHA `
              --title $env:RELEASE_TITLE `
              --prerelease `
              --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Could not create release $env:RELEASE_TAG" }
          }

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release upload $env:RELEASE_TAG `
            dist-desktop/DeepSeek-Harness-Setup-*-x64.exe `
            dist-desktop/SHA256SUMS `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload assets to $env:RELEASE_TAG" }
